name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore KiwiSaaS.sln

      - name: Build
        run: dotnet build KiwiSaaS.sln -c Release --no-restore

      - name: Test
        run: dotnet test KiwiSaaS.sln -c Release --no-build --logger trx
